<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TarsEnterprise — 万物皆 MCP 🚀</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #e0e0e0; display: flex; justify-content: center; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 560px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; border: 1px solid rgba(255,255,255,0.1); }
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { font-size: 28px; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo p { color: #888; margin-top: 8px; font-size: 14px; }
.step { display: none; }
.step.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.step-title { font-size: 20px; margin-bottom: 8px; color: #fff; }
.step-desc { color: #aaa; font-size: 14px; margin-bottom: 24px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 14px; margin-bottom: 8px; color: #ccc; }
.field select, .field input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
.field select:focus, .field input:focus { border-color: #00d4ff; }
.field select option { background: #1a1a2e; color: #fff; }
.buttons { display: flex; gap: 12px; margin-top: 28px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
.btn-prev { background: rgba(255,255,255,0.08); color: #ccc; }
.btn-prev:hover { background: rgba(255,255,255,0.15); }
.btn-next { background: linear-gradient(90deg, #00d4ff, #7b2ff7); color: #fff; }
.btn-next:hover { opacity: 0.9; transform: translateY(-1px); }
.progress { display: flex; gap: 6px; margin-bottom: 30px; }
.progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #7b2ff7); border-radius: 2px; transition: width 0.3s; }
.done { text-align: center; padding: 40px 0; }
.done h2 { font-size: 24px; margin-bottom: 16px; color: #00d4ff; }
.done p { color: #aaa; margin-bottom: 24px; }
.done .btn-next { display: inline-block; width: auto; padding: 14px 40px; text-decoration: none; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
.checkbox-group label { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
.checkbox-group label:hover { border-color: #00d4ff; }
.checkbox-group input { width: auto; }
.error-msg { color: #ff6b6b; font-size: 13px; margin-top: 6px; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>TarsEnterprise</h1>
    <p>万物皆 MCP — 企业级 AI 网关配置向导</p>
  </div>
  <div class="progress" id="progress"></div>
  <div id="steps"></div>
</div>
<script>
const stepsData = [
  { id: 'step1', title: '第 1 步：选择公司类型', desc: '告诉我们你的组织类型，我们会自动配置合适的角色和权限', fields: [{ id: 'company_type', label: '公司类型', type: 'select', options: ['education|学校','tech|互联网公司','kpi|传统KPI考核公司','consulting|咨询公司','finance|金融机构','gov|政企机构'], required: true }] },
  { id: 'step2', title: '第 2 步：配置角色', desc: '选择组织中需要使用的角色', fields: [{ id: 'roles', label: '角色', type: 'multi', options: ['admin|管理员','manager|经理','employee|员工','guest|访客'], required: true }] },
  { id: 'step3', title: '第 3 步：接入客户端', desc: '配置需要接入的客户端', fields: [{ id: 'clients', label: '客户端类型', type: 'multi', options: ['tsg_personal|TSG个人版','discord|Discord','telegram|Telegram','feishu|飞书','custom|自定义'], required: false }] },
  { id: 'step4', title: '第 4 步：挂载工具', desc: '选择需要挂载的 AI 工具 / MCP Server', fields: [{ id: 'tools', label: '工具', type: 'multi', options: ['openclaw|OpenClaw','openai_fc|OpenAI Function Calling','custom_python|Python自定义','custom_nodejs|Node.js自定义'], required: false }] },
  { id: 'step5', title: '第 5 步：安全与沙箱', desc: '配置沙箱和互通安全选项', fields: [{ id: 'sandbox', label: '启用沙箱', type: 'select', options: ['gvisor|gVisor（推荐）','seccomp|Seccomp','none|不启用'], required: true },{ id: 'tsg_bridge', label: '启用 TSG 互通', type: 'select', options: ['true|启用','false|暂不启用'], required: true }] },
  { id: 'step6', title: '第 6 步：完成', desc: '配置完成！点击完成启动网关', fields: [{ id: 'confirm', label: '确认启动', type: 'select', options: ['true|立即启动'], required: true }] }
];
let currentStep = 0;
const answers = {};

function renderProgress() {
  const el = document.getElementById('progress');
  el.innerHTML = stepsData.map((_, i) => `<div class="progress-bar"><div class="fill" style="width:${i <= currentStep ? 100 : 0}%"></div></div>`).join('');
}

function renderSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = stepsData.map((step, i) => {
    const fields = step.fields.map(f => {
      if (f.type === 'select') {
        return `<div class="field"><label>${f.label}${f.required ? ' *' : ''}</label><select id="${f.id}" ${f.required ? 'required' : ''}><option value="">请选择...</option>${f.options.map(o => { const [v,t] = o.split('|'); return `<option value="${v}">${t}</option>`; }).join('')}</select><div class="error-msg" id="err-${f.id}">此项必填</div></div>`;
      }
      if (f.type === 'multi') {
        return `<div class="field"><label>${f.label}${f.required ? ' *' : ''}</label><div class="checkbox-group">${f.options.map(o => { const [v,t] = o.split('|'); return `<label><input type="checkbox" name="${f.id}" value="${v}"> ${t}</label>`; }).join('')}</div><div class="error-msg" id="err-${f.id}">请至少选择一项</div></div>`;
      }
      return '';
    }).join('');
    const isLast = i === stepsData.length - 1;
    const prevBtn = i > 0 ? `<button class="btn btn-prev" onclick="prevStep()">上一步</button>` : '<div></div>';
    const nextBtn = isLast
      ? `<button class="btn btn-next" onclick="finish()">完成并启动</button>`
      : `<button class="btn btn-next" onclick="nextStep()">下一步</button>`;
    return `<div class="step ${i === currentStep ? 'active' : ''}" id="step-${i}">
      <div class="step-title">${step.title}</div>
      <div class="step-desc">${step.desc}</div>
      ${fields}
      <div class="buttons">${prevBtn}${nextBtn}</div>
    </div>`;
  }).join('');
}

function validateStep(i) {
  const step = stepsData[i];
  let valid = true;
  for (const f of step.fields) {
    const errEl = document.getElementById(`err-${f.id}`);
    if (f.type === 'select') {
      const val = document.getElementById(f.id).value;
      if (f.required && !val) { errEl.style.display = 'block'; valid = false; }
      else { errEl.style.display = 'none'; answers[f.id] = val; }
    }
    if (f.type === 'multi') {
      const checked = Array.from(document.querySelectorAll(`input[name="${f.id}"]:checked`)).map(cb => cb.value);
      if (f.required && checked.length === 0) { errEl.style.display = 'block'; valid = false; }
      else { errEl.style.display = 'none'; answers[f.id] = checked; }
    }
  }
  return valid;
}

function nextStep() {
  if (!validateStep(currentStep)) return;
  document.getElementById(`step-${currentStep}`).classList.remove('active');
  currentStep++;
  renderProgress();
  renderSteps();
}

function prevStep() {
  if (currentStep > 0) {
    document.getElementById(`step-${currentStep}`).classList.remove('active');
    currentStep--;
    renderProgress();
    renderSteps();
  }
}

function finish() {
  if (!validateStep(currentStep)) return;
  fetch('/api/v1/config/merge', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ modules: [{ wizard_answers: answers }] })
  });
  document.getElementById('steps').innerHTML = `<div class="step active done"><h2>🎉 配置完成！</h2><p>网关正在启动中...<br>API 地址: http://localhost:8888</p><a href="/" class="btn btn-next">进入控制台</a></div>`;
}

renderProgress();
renderSteps();
</script>
</body>
</html>
